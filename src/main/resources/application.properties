quarkus.http.port=${SERVER_PORT:8080}

# Keep Quarkus native image memory footprint low by default.
quarkus.banner.enabled=false

# scIPTV config (env vars compatible via MP Config mapping)
sciptv.source-id=${SCIPTV_SOURCE_ID:1}
sciptv.api-url-template=${SCIPTV_API_URL_TEMPLATE:https://epg.51zmt.top:8001/multicast/api/channels/{sourceId}/}
sciptv.output-dir=${SCIPTV_OUTPUT_DIR:output/playlists}
sciptv.http-proxy-base-url=${SCIPTV_HTTP_PROXY_BASE_URL:http://192.168.3.1:8188}
sciptv.epg-urls=${SCIPTV_EPG_URLS:https://epg.51zmt.top:8001/e.xml,https://epg.112114.xyz/pp.xml}
