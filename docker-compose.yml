version: "3.9"

services:
  sciptv:
    build:
      context: .
      dockerfile: Dockerfile
    image: sciptv:latest
    container_name: sciptv
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:+TieredCompilation -XX:TieredStopAtLevel=1}
      SCIPTV_HTTP_PROXY_BASE_URL: ${SCIPTV_HTTP_PROXY_BASE_URL:-http://192.168.3.1:8188}
      SCIPTV_EPG_URLS: ${SCIPTV_EPG_URLS:-https://epg.51zmt.top:8001/e.xml,https://epg.112114.xyz/pp.xml}
      SCIPTV_FCC_ADDRESS: ${SCIPTV_FCC_ADDRESS:-182.139.234.40:8027}
    restart: unless-stopped
