name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: sciptv

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set up Node.js
        if: ${{ success() && secrets.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Serverless Devs
        if: ${{ success() && secrets.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        run: npm install -g @serverless-devs/s

      - name: Configure Serverless Devs credentials
        if: ${{ success() && secrets.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          s config add \
            --AccessKeyID "${ALIBABA_CLOUD_ACCESS_KEY_ID}" \
            --AccessKeySecret "${ALIBABA_CLOUD_ACCESS_KEY_SECRET}" \
            --Access default \
            --force

      - name: Deploy to Aliyun FC
        if: ${{ success() && secrets.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        run: s deploy --template s.yaml --use-local -y
