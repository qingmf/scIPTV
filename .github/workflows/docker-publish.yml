name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: sciptv
  ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
  ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}

jobs:
  docker:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build native runner (Quarkus)
        run: ./mvnw package -Pnative -Dquarkus.native.container-build=true -DskipTests

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Node.js
        if: ${{ success() && env.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && env.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Serverless Devs
        if: ${{ success() && env.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && env.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        run: npm install -g @serverless-devs/s

      - name: Configure Serverless Devs credentials
        if: ${{ success() && env.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && env.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        run: |
          s config add \
            --AccessKeyID "${ALIBABA_CLOUD_ACCESS_KEY_ID}" \
            --AccessKeySecret "${ALIBABA_CLOUD_ACCESS_KEY_SECRET}" \
            --access default \
            --force

      - name: Deploy to Aliyun FC
        if: ${{ success() && env.ALIBABA_CLOUD_ACCESS_KEY_ID != '' && env.ALIBABA_CLOUD_ACCESS_KEY_SECRET != '' }}
        run: s deploy --template s.yaml --use-local -y
